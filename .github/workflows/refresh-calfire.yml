name: Refresh CAL FIRE dashboard
on:
  push:
    branches: [main]
    paths:
      - "scripts/lib/calfire*.mjs"
      - "scripts/update-calfire.mjs"
      - ".github/workflows/refresh-calfire.yml"
  schedule:
    - cron: "0 15 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: calfire-dashboard-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Test CAL FIRE extraction and refresh safety
        run: npm run test:data
      - name: Fetch and validate CAL FIRE figures
        run: npm run data:update
      - name: Save verified daily snapshot
        run: |
          if ! git diff --quiet -- public/data/calfire-summary.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add public/data/calfire-summary.json
            git commit -m "Refresh verified CAL FIRE dashboard figures"
            git push
          fi
